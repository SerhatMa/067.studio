<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>067 Studio</title>
<meta name="description" content="067 Studio is an independent game studio based in Warsaw.">
<meta name="theme-color" content="#0E0D0B">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0D0B;
  --gold:#C39A3E;
  --text:#E6DCC6;
  --dim:#9A8F7A;
  --line:#2A2620;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{
  font-family:'Josefin Sans','Futura','Century Gothic',system-ui,sans-serif;
  font-weight:300;
  min-height:100vh;min-height:100svh;
  display:grid;grid-template-rows:1fr auto;
  -webkit-font-smoothing:antialiased;
}
main{
  display:grid;place-items:center;
  padding:12vh 16px 8vh;
}
.lockup{width:min(300px,72vw);height:auto;display:block}
.rays polygon{transform-origin:160px 150px;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.disc{animation:fade 1.2s ease-out both}
.word{animation:fade 1.4s .6s ease-out both}
@keyframes rise{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tag{
  margin-top:40px;
  font-size:15px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--dim);text-align:center;
}
.mail{
  display:inline-block;margin-top:28px;
  font-size:18px;letter-spacing:.08em;font-weight:400;
  color:var(--gold);text-decoration:none;
  border-bottom:1px solid currentColor;padding-bottom:4px;
}
.mail:hover{color:var(--text)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.center{text-align:center}
footer{
  border-top:1px solid var(--line);
  padding:28px 16px 32px;
  font-size:13px;line-height:1.7;letter-spacing:.03em;color:var(--dim);
}
.legal{
  max-width:960px;margin:0 auto;
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px;
}
.legal strong{color:var(--text);font-weight:400}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
